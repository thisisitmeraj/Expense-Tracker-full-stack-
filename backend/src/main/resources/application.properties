# =============================================================================
# Change spring.datasource.password to YOUR MySQL root password.
# =============================================================================
spring.application.name=expense-tracker

server.port=8080

spring.datasource.url=jdbc:mysql://localhost:3306/expense_db?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
spring.datasource.username=root
spring.datasource.password=1234567890

# Tables already come from schema.sql — do not let Hibernate recreate them.
spring.jpa.hibernate.ddl-auto=none
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect
spring.jpa.open-in-view=false

# HS256 needs a secret at least 32 characters (256 bits).
jwt.secret=expense-tracker-dev-secret-key-change-me-32
# 24 hours in milliseconds
jwt.expiration-ms=86400000
